services:
  - type: web
    name: secubot-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # El bot Discord se inicia en app.main lifespan cuando DISCORD_BOT_TOKEN está configurado
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DISCORD_NOTIFICATIONS_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
