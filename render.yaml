services:
  - type: web
    name: secubot-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Discord bot starts in app.main lifespan when DISCORD_BOT_TOKEN is configured.
    # If token is not set, only the FastAPI API is started.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DISCORD_NOTIFICATIONS_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
