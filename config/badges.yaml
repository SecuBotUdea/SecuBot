# ============================================================================
# SECUBOT - BADGES DE GAMIFICACIÓN (SUPLEMENTARIOS)
# Definiciones adicionales de badges para el sistema de gamificación.
# Los badges BDG-001 a BDG-006 ya están definidos en rules.yaml.
# Este archivo extiende el catálogo con nuevos badges clasificados por tier.
# Versión: 1.0.0
# ============================================================================

badge_rules:

  # --------------------------------------------------------------------------
  # TIER BRONCE - Primeros logros del desarrollador
  # --------------------------------------------------------------------------

  - badge_id: "BDG-101"
    name: "Remediador Persistente"
    description: "Completaste 5 remediaciones verificadas en total"
    category: "milestone"
    tier: "bronze"
    icon_url: "/badges/persistent-remediator.svg"
    active: true
    version: 1

    criteria:
      type: "individual"
      conditions:
        - count:
            entity: "PointTxn"
            filters:
              - "user_id == current_user"
              - "points > 0"
            operator: ">="
            threshold: 5

    award_trigger:
      event: "rescan_completed"
      immediate: true

  - badge_id: "BDG-102"
    name: "Domador de HIGH"
    description: "Remediaste 3 vulnerabilidades HIGH verificadas"
    category: "severity"
    tier: "bronze"
    icon_url: "/badges/high-tamer.svg"
    active: true
    version: 1

    criteria:
      type: "individual"
      conditions:
        - count:
            entity: "PointTxn"
            filters:
              - "user_id == current_user"
              - "rule_id == 'PTS-002'"
